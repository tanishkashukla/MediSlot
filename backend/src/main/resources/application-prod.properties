# Production Configuration (Railway / Hosted PostgreSQL)
server.port=${PORT:8080}

spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:medislot}}}
spring.datasource.username=${DATABASE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:${PGPASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

medislot.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
medislot.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
medislot.waiting-list.offer-expiry-ms=${OFFER_EXPIRY_MS:900000}
