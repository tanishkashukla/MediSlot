spring.application.name=medislot-backend

# Server Configuration
server.port=8081

# H2 Database Configuration (Local Development)
spring.datasource.url=jdbc:h2:mem:medislotdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Secret Key (Base64 encoded 256-bit key) and Expiration (24 hours in milliseconds)
medislot.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
medislot.jwt.expiration-ms=86400000

# Waiting List Offer Expiry Window (15 minutes in milliseconds)
medislot.waiting-list.offer-expiry-ms=900000

# Logging
logging.level.com.medislot=INFO
logging.level.org.springframework.security=INFO
